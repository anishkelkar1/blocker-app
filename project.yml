name: FocusLock
options:
  bundleIdPrefix: com.anishkelkar
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Apple Developer Team ID. Kept OUT of this public repo: export it as
    # FOCUSLOCK_TEAM_ID before running `xcodegen generate` and XcodeGen expands
    # the ${...} below. The generated .xcodeproj is gitignored, so the real ID
    # is never committed. (A Team ID isn't secret, but there's no need to post it.)
    DEVELOPMENT_TEAM: "${FOCUSLOCK_TEAM_ID}"
    SWIFT_VERSION: "5.0"

# XcodeGen regenerates every Info.plist and .entitlements file listed below
# from these `properties` on each `xcodegen generate`, so the capabilities and
# extension declarations live here as the single source of truth. Editing the
# generated files directly would be overwritten on the next generate.
targets:
  FocusLock:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FocusLock
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: App/FocusLock.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.anishkelkar.focuslock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anishkelkar.focuslock
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: FocusLockMonitor
      - target: FocusLockShield
      - target: FocusLockTunnel

  FocusLockMonitor:
    type: app-extension
    platform: iOS
    sources:
      - Monitor
      - Shared
    info:
      path: Monitor/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: Monitor/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.anishkelkar.focuslock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anishkelkar.focuslock.monitor

  FocusLockShield:
    type: app-extension
    platform: iOS
    sources:
      - Shield
      - Shared
    info:
      path: Shield/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: Shield/Shield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.anishkelkar.focuslock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anishkelkar.focuslock.shield

  FocusLockTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel
      - Shared
    info:
      path: Tunnel/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/Tunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.anishkelkar.focuslock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anishkelkar.focuslock.tunnel

# A shared scheme so `xcodebuild -scheme FocusLock` keeps working after every
# `xcodegen generate` (otherwise only Xcode's auto-created user scheme exists).
schemes:
  FocusLock:
    build:
      targets:
        FocusLock: all
    run:
      config: Debug
    archive:
      config: Release
